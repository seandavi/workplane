services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workplane
      POSTGRES_PASSWORD: workplane
      POSTGRES_DB: workplane
    ports:
      - "127.0.0.1:5433:5432"   # host port 5433 for tests and psql; avoids a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workplane -d workplane"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file:
      - path: .env          # GITHUB_TOKEN, SYNC_INTERVAL_SECONDS
        required: false
    environment:
      DATABASE_URL: postgresql://workplane:workplane@db:5432/workplane
      WORKPLANE_CONFIG: /app/workplane.toml
    volumes:
      - ./workplane.toml:/app/workplane.toml:ro
    ports:
      - "127.0.0.1:8642:8642"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
