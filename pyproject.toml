[project]
name = "workplane"
version = "0.1.0"
description = "A personal work queue over GitHub issues and manual tasks, with an event log and an enforced state machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Davis" }]
keywords = ["github", "issues", "work-queue", "triage", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.22",
    "httpx>=0.27",
    "typer>=0.12",
    "tzdata>=2026.5",
]

[project.urls]
Homepage = "https://github.com/seandavi/workplane"
Issues = "https://github.com/seandavi/workplane/issues"

[project.scripts]
work = "workplane.cli:app"
workplane-server = "workplane.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
